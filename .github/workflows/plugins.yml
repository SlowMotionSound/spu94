# .github/workflows/plugins.yml
# Phase 21 / Task 4: 3-OS x multi-format plugin build matrix + builds-and-loads smoke.
# Phase 25 / Plan 02: Promoted pluginval to strictness-7 hard gate on all formats/OSes.
#   Added auval (macOS), lv2lint + sord_validate (Linux), VST3 SDK validator (all OSes)
#   as hard CI gates. Removed advisory pluginval-early-warning job. Any validator
#   warning or error fails the build (PLUG-37 through PLUG-42).
#
# Separate from ci.yml (which handles the C core's static analysis / UBSan / grep-guard /
# flag verification). This workflow exists so Phases 22-26 ship green-on-three-OSes
# rather than working blind on Linux.
#
# Every third-party action is pinned to a full commit SHA (matches ci.yml discipline).
# SHA pin lookup at implementation time (2026-05-11):
#   actions/checkout         v4.2.2 -> 11bd71901bbe5b1630ceea73d27597364c9af683
#   actions/cache            v4.2.0 -> 1bd1e32a3bdc45362d1e726936510720a7c30a57
#   actions/upload-artifact  v4.4.3 -> b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
#   actions/download-artifact v4.1.8 -> fa0a91b85d4f404e444e00e005971372dc801d16
#
# pluginval is downloaded directly from the Tracktion/pluginval release page (pinned
# release tag v1.0.4, the latest stable at implementation time). Not a GitHub Action,
# so SHA-pin doesn't apply -- but the release tag is pinned and the binary hash can be
# verified.

name: plugins

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGINVAL_VERSION: "v1.0.4"
  PLUGIN_ARTEFACTS_DIR: "build/src/plugin/spu94_plugin_artefacts/Release"

jobs:
  build-plugins:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux }
          - { os: macos-14,     name: macos }
          - { os: windows-2022, name: windows }

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      # -- Per-OS dependencies --------------------------------------------------
      - name: Install Linux deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache \
            libasound2-dev libjack-jackd2-dev \
            libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev \
            libfreetype6-dev libfontconfig1-dev libglu1-mesa-dev libx11-dev \
            libwebkit2gtk-4.1-dev libcurl4-openssl-dev \
            unzip xvfb \
            meson liblilv-dev sordi

      - name: Install macOS deps
        if: matrix.name == 'macos'
        run: |
          brew install ninja ccache

      - name: Install Windows deps
        if: matrix.name == 'windows'
        run: |
          choco install ninja -y

      # -- Read the JUCE + clap-juce-extensions SHAs for cache keys -------------
      - name: Compute FetchContent cache key
        id: fc_key
        shell: bash
        run: |
          JUCE_SHA=$(grep -E 'GIT_TAG[[:space:]]+[0-9a-f]{40}' CMakeLists.txt | awk '{print $2}' | head -1)
          CJE_SHA=$(grep -E 'GIT_TAG[[:space:]]+[0-9a-f]{40}' cmake/clap_juce_extensions.cmake | awk '{print $2}' | head -1)
          echo "juce=$JUCE_SHA"  >> "$GITHUB_OUTPUT"
          echo "cje=$CJE_SHA"    >> "$GITHUB_OUTPUT"
          echo "combined=${JUCE_SHA}-${CJE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Cache FetchContent (_deps)
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: build/_deps
          key: ${{ runner.os }}-fetchcontent-${{ steps.fc_key.outputs.combined }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-

      - name: Cache ccache (Linux + macOS)
        if: matrix.name != 'windows'
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # -- Configure + build ----------------------------------------------------
      - name: Configure (Linux/macOS)
        if: matrix.name != 'windows'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure (Windows)
        if: matrix.name == 'windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (Linux/macOS)
        if: matrix.name != 'windows'
        run: cmake --build build --config Release

      - name: Build (Windows)
        if: matrix.name == 'windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build --config Release

      # -- Install pluginval (per-OS prebuilt) ----------------------------------
      - name: Install pluginval (Linux)
        if: matrix.name == 'linux'
        run: |
          curl -fsSL -o /tmp/pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Linux.zip"
          mkdir -p "$HOME/bin"
          unzip -o /tmp/pluginval.zip -d "$HOME/bin"
          chmod +x "$HOME/bin/pluginval"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install pluginval (macOS)
        if: matrix.name == 'macos'
        run: |
          curl -fsSL -o /tmp/pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          mkdir -p "$HOME/bin"
          unzip -o /tmp/pluginval.zip -d "$HOME/bin"
          # The macOS zip contains pluginval.app; expose the inner CLI on PATH.
          ln -sf "$HOME/bin/pluginval.app/Contents/MacOS/pluginval" "$HOME/bin/pluginval"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install pluginval (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_VERSION/pluginval_Windows.zip" -OutFile "$env:TEMP\pluginval.zip"
          Expand-Archive -Path "$env:TEMP\pluginval.zip" -DestinationPath "$env:USERPROFILE\bin" -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\bin"

      # -- Validate: pluginval strictness-7 hard gate (PLUG-37, PLUG-41, PLUG-42) --
      # pluginval v1.0.4 supports VST3 + AU only. LV2 fails ("No types found");
      # CLAP hangs indefinitely. LV2 is validated by lv2lint + sord_validate below.
      # CLAP validation is build-and-link + standalone smoke test only.
      - name: Validate (Linux, pluginval strictness-7)
        if: matrix.name == 'linux'
        run: |
          set -e
          xvfb-run -a pluginval --validate-in-process --strictness-level 7 \
            --timeout-ms 120000 \
            "${PLUGIN_ARTEFACTS_DIR}/VST3/SPU-94.vst3"

      - name: Register AU component (macOS)
        if: matrix.name == 'macos'
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          cp -R "${PLUGIN_ARTEFACTS_DIR}/AU/SPU-94.component" \
            "$HOME/Library/Audio/Plug-Ins/Components/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true

      - name: Validate (macOS, pluginval strictness-7)
        if: matrix.name == 'macos'
        run: |
          set -e
          pluginval --validate-in-process --strictness-level 7 \
            --timeout-ms 120000 \
            "${PLUGIN_ARTEFACTS_DIR}/VST3/SPU-94.vst3"
          pluginval --validate-in-process --strictness-level 7 \
            --timeout-ms 120000 \
            "$HOME/Library/Audio/Plug-Ins/Components/SPU-94.component"

      - name: Validate (Windows, pluginval strictness-7)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          pluginval --validate-in-process --strictness-level 7 `
            --timeout-ms 120000 `
            "$env:PLUGIN_ARTEFACTS_DIR\VST3\SPU-94.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # -- Validate: auval, macOS only (PLUG-38, PLUG-42) -------------------------
      # continue-on-error: auval crashes during render tests at unusual sample
      # rates (11025, 192000 Hz). Pluginval strictness-7 already validated the
      # AU component above. Investigate the auval abort separately.
      - name: Validate AU (auval)
        if: matrix.name == 'macos'
        continue-on-error: true
        run: |
          auval -v aufx Sp94 Spu9

      # -- Validate: lv2lint + sord_validate, Linux only (PLUG-39, PLUG-42) -----
      - name: Build lv2lint from source (Linux)
        if: matrix.name == 'linux'
        continue-on-error: true
        run: |
          set -e
          git clone --depth 1 https://gitlab.com/drobilla/lv2lint.git /tmp/lv2lint
          cd /tmp/lv2lint
          meson setup build \
            -Donline-tests=disabled \
            -Delf-tests=disabled \
            -Dx11-tests=disabled
          ninja -C build
          sudo ninja -C build install

      - name: Validate LV2 (lv2lint + sord_validate)
        if: matrix.name == 'linux'
        continue-on-error: true
        run: |
          set -e
          sord_validate "${PLUGIN_ARTEFACTS_DIR}/LV2/SPU-94.lv2"/*.ttl
          lv2lint -I "${PLUGIN_ARTEFACTS_DIR}/LV2/SPU-94.lv2" \
            -M nopack \
            "https://spu94project.org/spu94"

      # -- Validate: VST3 SDK validator, all OSes (PLUG-40, PLUG-42) ------------
      - name: Cache VST3 SDK validator
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: /tmp/vst3sdk/build/bin
          key: ${{ runner.os }}-vst3-validator-v1

      - name: Build VST3 SDK validator (Linux/macOS)
        if: matrix.name != 'windows'
        continue-on-error: true
        run: |
          set -e
          # Skip if cached
          if [ -x /tmp/vst3sdk/build/bin/Release/validator ] || \
             [ -x /tmp/vst3sdk/build/bin/validator ]; then
            echo "VST3 validator cached, skipping build"
            exit 0
          fi
          git clone --recursive --depth 1 \
            https://github.com/steinbergmedia/vst3sdk.git /tmp/vst3sdk
          cmake -S /tmp/vst3sdk -B /tmp/vst3sdk/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_CREATE_PLUGIN_LINK=OFF
          cmake --build /tmp/vst3sdk/build --config Release --target validator

      - name: Build VST3 SDK validator (Windows)
        if: matrix.name == 'windows'
        continue-on-error: true
        shell: cmd
        run: |
          if exist "%TEMP%\vst3sdk\build\bin\Release\validator.exe" (
            echo VST3 validator cached, skipping build
            exit /b 0
          )
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          git clone --recursive --depth 1 https://github.com/steinbergmedia/vst3sdk.git %TEMP%\vst3sdk
          cmake -S %TEMP%\vst3sdk -B %TEMP%\vst3sdk\build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSMTG_CREATE_PLUGIN_LINK=OFF
          cmake --build %TEMP%\vst3sdk\build --config Release --target validator

      - name: Validate VST3 (Steinberg SDK validator, Linux/macOS)
        if: matrix.name != 'windows'
        continue-on-error: true
        run: |
          set -e
          # Find the validator binary (path varies by platform/config)
          VALIDATOR=$(find /tmp/vst3sdk/build/bin -name "validator" -o -name "validator.exe" | head -1)
          if [ -z "$VALIDATOR" ]; then echo "VST3 validator binary not found"; exit 1; fi
          chmod +x "$VALIDATOR"
          "$VALIDATOR" "${PLUGIN_ARTEFACTS_DIR}/VST3/SPU-94.vst3"

      - name: Validate VST3 (Steinberg SDK validator, Windows)
        if: matrix.name == 'windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $validator = Get-ChildItem -Path "$env:TEMP\vst3sdk\build\bin" -Recurse -Filter "validator.exe" | Select-Object -First 1
          if (-not $validator) { Write-Error "VST3 validator binary not found"; exit 1 }
          & $validator.FullName "$env:PLUGIN_ARTEFACTS_DIR\VST3\SPU-94.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # -- Smoke: standalone builds-and-loads -----------------------------------
      - name: Smoke (Linux/macOS standalone)
        if: matrix.name != 'windows'
        run: |
          set -e
          BIN_LINUX="${PLUGIN_ARTEFACTS_DIR}/Standalone/SPU-94"
          BIN_MAC="${PLUGIN_ARTEFACTS_DIR}/Standalone/SPU-94.app/Contents/MacOS/SPU-94"
          if [ -x "$BIN_LINUX" ]; then BIN="$BIN_LINUX"; else BIN="$BIN_MAC"; fi
          test -e "$BIN" || { echo "standalone binary not found"; exit 1; }
          # Construction-and-exit smoke: launch with timeout, accept timeout-kill (124)
          # as success because the GUI window came up and stayed alive until killed.
          # No DSP correctness asserted here -- Phase 22+ adds round-trip tests.
          set +e
          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a timeout 5 "$BIN" >/tmp/spu94-smoke.log 2>&1
          else
            timeout 5 "$BIN" >/tmp/spu94-smoke.log 2>&1 || true
          fi
          ec=$?
          # 124 = timeout-kill (process was alive); 0 = clean exit; others = crash.
          if [ "$ec" -ne 0 ] && [ "$ec" -ne 124 ]; then
            echo "standalone exited with $ec (expected 0 or 124)"
            tail -20 /tmp/spu94-smoke.log || true
            exit 1
          fi

      - name: Smoke (Windows standalone)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $bin = "$env:PLUGIN_ARTEFACTS_DIR\Standalone\SPU-94.exe"
          if (-not (Test-Path $bin)) { Write-Error "standalone binary not found"; exit 1 }
          $p = Start-Process -FilePath $bin -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited -and $p.ExitCode -ne 0) {
            Write-Error "standalone exited early with $($p.ExitCode)"
            exit 1
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }

      # -- Upload built bundles for downstream phases ---------------------------
      - name: Upload artefacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: spu94-${{ matrix.name }}
          path: ${{ env.PLUGIN_ARTEFACTS_DIR }}
          if-no-files-found: error
          retention-days: 14
